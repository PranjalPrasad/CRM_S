<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Serenity CRM</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:{DEFAULT:'#0d9488',dark:'#0f766e',light:'#ccfbf1'}}}}}</script>
  <link rel="stylesheet" href="assets/css/custom.css">
  <!-- Chart.js (this page has charts) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body data-page="dashboard" data-title="Dashboard">
  <div id="app-sidebar"></div>
  <div class="lg:pl-64 min-h-screen flex flex-col">
    <div id="app-topbar"></div>
    <main class="flex-1 p-4 lg:p-8 space-y-6">

      <!-- 1. Greeting + date range filter -->
      <section class="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
        <div>
          <h2 id="greeting" class="text-2xl font-bold text-slate-800"></h2>
          <p id="today" class="text-sm text-slate-500 mt-1"></p>
        </div>
        <div id="rangeFilter" class="inline-flex p-1 bg-white border border-slate-200 rounded-xl text-sm self-start">
          <button data-range="today" class="px-4 py-1.5 rounded-lg">Today</button>
          <button data-range="week" class="px-4 py-1.5 rounded-lg">This Week</button>
          <button data-range="month" class="px-4 py-1.5 rounded-lg">This Month</button>
        </div>
      </section>

      <!-- 2. KPI cards (rendered by JS) -->
      <section id="kpiGrid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4"></section>

      <!-- 3. Charts -->
      <section class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div class="card p-5"><h3 class="font-semibold text-slate-800 mb-3">Revenue, last 6 months</h3><div class="h-64"><canvas id="revChart"></canvas></div></div>
        <div class="card p-5"><h3 class="font-semibold text-slate-800 mb-3">Lead source performance</h3><div class="h-64"><canvas id="leadChart"></canvas></div></div>
        <div class="card p-5"><h3 class="font-semibold text-slate-800 mb-3">Top services (bookings)</h3><div class="h-64"><canvas id="svcChart"></canvas></div></div>
        <div class="card p-5"><h3 class="font-semibold text-slate-800 mb-3">New vs repeat customers</h3><div class="h-64"><canvas id="custChart"></canvas></div></div>
      </section>

      <!-- 4 + 5. Appointments and low stock -->
      <section class="grid grid-cols-1 xl:grid-cols-3 gap-4">
        <div class="card p-5 xl:col-span-3"><!-- was xl:col-span-2 (low stock card removed) -->
          <div class="flex items-center justify-between mb-3">
            <h3 class="font-semibold text-slate-800">Today's appointments</h3>
            <a href="appointments.html" class="text-sm font-medium text-teal-700 hover:text-teal-800">View all</a>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="text-left text-slate-500 border-b border-slate-100"><tr><th class="py-2 pr-3 font-medium">Time</th><th class="pr-3 font-medium">Customer</th><th class="pr-3 font-medium">Service</th><th class="pr-3 font-medium">Therapist</th><th class="font-medium">Status</th></tr></thead>
              <tbody id="apptRows" class="divide-y divide-slate-50"></tbody>
            </table>
          </div>
        </div>
        <!-- Inventory module commented out: Low stock alerts card
        <div class="card p-5">
          <div class="flex items-center justify-between mb-3">
            <h3 class="font-semibold text-slate-800">Low stock alerts</h3>
            <a href="inventory.html" class="text-sm font-medium text-teal-700 hover:text-teal-800">Inventory</a>
          </div>
          <ul id="stockList" class="space-y-4"></ul>
        </div>
        -->
      </section>

      <!-- 6 + 7. Birthdays and feedback -->
      <section class="grid grid-cols-1 gap-4"><!-- was lg:grid-cols-2 (feedback card removed) -->
        <div class="card p-5">
          <h3 class="font-semibold text-slate-800 mb-3">Upcoming birthdays &amp; anniversaries</h3>
          <ul id="eventList" class="divide-y divide-slate-100"></ul>
        </div>
        <!-- Feedback module commented out: Recent feedback card
        <div class="card p-5">
          <div class="flex items-center justify-between mb-3">
            <h3 class="font-semibold text-slate-800">Recent feedback</h3>
            <a href="feedback.html" class="text-sm font-medium text-teal-700 hover:text-teal-800">View all</a>
          </div>
          <ul id="fbList" class="divide-y divide-slate-100"></ul>
        </div>
        -->
      </section>
    </main>
  </div>

  <div id="toast" class="fixed bottom-5 right-5 z-50 hidden bg-slate-800 text-white text-sm px-4 py-2.5 rounded-lg shadow-lg"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
  (function(){
    if(!localStorage.getItem('crmUser'))return; // layout.js is redirecting
    const user=JSON.parse(localStorage.getItem('crmUser'));
    const $=id=>document.getElementById(id);
    const now=new Date();

    // ---------- Greeting ----------
    const h=now.getHours();
    $('greeting').textContent=`Good ${h<12?'morning':h<17?'afternoon':'evening'}, ${user.name}`;
    $('today').textContent=now.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

    // ---------- Toast ----------
    let tt; const toast=m=>{const t=$('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(tt);tt=setTimeout(()=>t.classList.add('hidden'),2200)};

    // ---------- KPI cards ----------
    const ic=p=>`<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="${p}"/></svg>`;
    // const avgRating=(feedback.reduce((s,f)=>s+f.rating,0)/feedback.length).toFixed(1);
    // const activeMem=memberships.filter(m=>m.status==='Active').length;
    function kpiDefs(r){const d=dashRange[r];return [
      ['Total Customers',customers.length,3.8,'customers.html','M17 20v-2a4 4 0 00-4-4H7a4 4 0 00-4 4v2M10 10a4 4 0 100-8 4 4 0 000 8'],
      ["Today's Appointments",d.appts[0],d.appts[1],'appointments.html','M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2z'],
      ['Monthly Revenue',fmtINR(d.revenue[0]),d.revenue[1],'billing.html','M2 6h20v12H2zM2 10h20M6 15h4'],
      // ['Active Memberships',activeMem,2.1,'memberships.html','M20 12v9H4v-9M2 7h20v5H2zM12 22V7'],
      // ['Low Stock Items',kpis.lowStockItems,-8.0,'inventory.html','M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v9'],
      ['New Customers',d.newCust[0],d.newCust[1],'customers.html','M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8M19 8v6M22 11h-6'],
      ['Repeat Customers',d.repeat[0],d.repeat[1],'customers.html','M17 1l4 4-4 4M3 11V9a4 4 0 014-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 01-4 4H3'],
      // ['Average Rating',avgRating+' / 5',1.2,'feedback.html','M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z']
    ]}
    function renderKpis(r){
      $('kpiGrid').innerHTML=kpiDefs(r).map(k=>{
        // For "Low Stock Items" a falling number is good, so flip the colour logic
        const good=k[0]==='Low Stock Items'?k[2]<0:k[2]>=0;
        return `<a href="${k[3]}" class="card p-5 flex items-start gap-4 hover:border-teal-300 transition">
          <div class="w-11 h-11 rounded-xl bg-teal-50 text-teal-700 grid place-items-center shrink-0">${ic(k[4])}</div>
          <div class="min-w-0"><p class="text-sm text-slate-500">${k[0]}</p>
            <p class="text-2xl font-bold text-slate-800 mt-0.5">${k[1]}</p>
            <p class="text-xs font-semibold mt-1 ${good?'text-emerald-600':'text-rose-600'}">${k[2]>=0?'▲':'▼'} ${Math.abs(k[2])}% <span class="font-normal text-slate-400">vs previous</span></p></div></a>`}).join('');
    }
    // ---------- Range filter ----------
    function setRange(r){
      document.querySelectorAll('#rangeFilter button').forEach(b=>{
        const on=b.dataset.range===r;
        b.className='px-4 py-1.5 rounded-lg '+(on?'bg-teal-600 text-white font-semibold':'text-slate-600 hover:bg-slate-100');
      });
      renderKpis(r);
    }
    $('rangeFilter').onclick=e=>{const b=e.target.closest('button');if(b)setRange(b.dataset.range)};
    setRange('today');

    // ---------- Charts ----------
    const teal=['#0d9488','#14b8a6','#5eead4','#0f766e','#99f6e4','#115e59','#2dd4bf','#134e4a','#ccfbf1'];
    Chart.defaults.font.family='Inter';Chart.defaults.color='#64748b';
    const grid={color:'#f1f5f9'};
    new Chart($('revChart'),{type:'line',data:{labels:revenueTrend.labels,datasets:[{data:revenueTrend.values,borderColor:'#0d9488',backgroundColor:'rgba(13,148,136,.12)',fill:true,tension:.35,pointRadius:4}]},
      options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmtINR(c.parsed.y)}}},scales:{y:{grid,ticks:{callback:v=>'₹'+v/1000+'k'}},x:{grid:{display:false}}}}});
    new Chart($('leadChart'),{type:'doughnut',data:{labels:leadSourcePerformance.labels,datasets:[{data:leadSourcePerformance.values,backgroundColor:['#0d9488','#e11d48','#2563eb','#16a34a','#f59e0b','#7c3aed','#0891b2','#ea580c','#64748b'],borderWidth:2}]},
      options:{maintainAspectRatio:false,cutout:'62%',plugins:{legend:{position:'right',labels:{boxWidth:10,boxHeight:10}}}}});
    new Chart($('svcChart'),{type:'bar',data:{labels:topServices.labels,datasets:[{data:topServices.values,backgroundColor:'#14b8a6',borderRadius:6}]},
      options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid},y:{grid:{display:false}}}}});
    new Chart($('custChart'),{type:'bar',data:{labels:newVsRepeat.labels,datasets:[{label:'New',data:newVsRepeat.newC,backgroundColor:'#0d9488',borderRadius:4},{label:'Repeat',data:newVsRepeat.repeat,backgroundColor:'#99f6e4',borderRadius:4}]},
      options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:10,boxHeight:10}}},scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,grid}}}});

    // ---------- Today's appointments ----------
    const iso=now.toISOString().slice(0,10);
    let todays=appointments.filter(a=>a.date===iso);
    if(!todays.length)todays=appointments.slice(0,6); // demo fallback: mock dates are fixed
    const badge={Booked:'new',Confirmed:'active',Completed:'inactive',Cancelled:'lost','No-show':'vip'};
    $('apptRows').innerHTML=todays.sort((a,b)=>a.time.localeCompare(b.time)).slice(0,7).map(a=>
      `<tr class="hover:bg-slate-50 cursor-pointer" onclick="location.href='appointments.html'"><td class="py-2.5 pr-3 font-medium text-slate-800 whitespace-nowrap">${a.time}</td><td class="pr-3">${a.customer}</td><td class="pr-3">${a.service}</td><td class="pr-3 text-slate-500">${a.staff}</td><td><span class="badge badge-${badge[a.status]}">${a.status}</span></td></tr>`).join('');

    /* Inventory module commented out: Low stock alerts
    // ---------- Low stock ----------
    $('stockList').innerHTML=products.filter(p=>p.stock<=p.reorderLevel).map(p=>
      `<li><div class="flex items-center justify-between gap-2 text-sm"><div class="min-w-0"><p class="font-medium text-slate-800 truncate">${p.name}</p><p class="text-xs text-slate-500">${p.stock} left · reorder at ${p.reorderLevel}</p></div>
       <button data-n="${p.name}" class="reorder shrink-0 px-3 py-1 rounded-lg border border-rose-200 text-rose-600 text-xs font-semibold hover:bg-rose-50">Reorder</button></div>
       <div class="mt-2 h-1.5 rounded-full bg-slate-100"><div class="h-1.5 rounded-full bg-rose-500" style="width:${Math.max(6,p.stock/p.reorderLevel*100)}%"></div></div></li>`).join('');
    $('stockList').onclick=e=>{const b=e.target.closest('.reorder');if(b)toast('Reorder request created for '+b.dataset.n)};
    */

    // ---------- Birthdays & anniversaries (next 30 days, year ignored) ----------
    const today0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    const events=[];
    customers.forEach(c=>[['Birthday',c.dob],['Anniversary',c.anniversary]].forEach(([type,d])=>{
      if(!d||d==='—')return;
      const [,m,day]=d.split('-').map(Number);
      let next=new Date(today0.getFullYear(),m-1,day); if(next<today0)next.setFullYear(next.getFullYear()+1);
      const diff=Math.round((next-today0)/864e5); if(diff<=30)events.push({c,type,next,diff});
    }));
    events.sort((a,b)=>a.diff-b.diff);
    $('eventList').innerHTML=events.length?events.slice(0,5).map(e=>
      `<li class="py-3 flex items-center justify-between gap-3"><div><p class="text-sm font-medium text-slate-800">${e.c.name}</p><p class="text-xs text-slate-500">${e.type} · ${e.next.toLocaleDateString('en-IN',{day:'numeric',month:'short'})} (${e.diff===0?'today':'in '+e.diff+' days'})</p></div>
       <button data-n="${e.c.name}" class="offer btn-primary text-xs !py-1.5 !px-3">Send Offer</button></li>`).join('')
      :'<li class="py-6 text-sm text-slate-500">No birthdays or anniversaries in the next 30 days.</li>';
    $('eventList').onclick=e=>{const b=e.target.closest('.offer');if(b)toast('Offer sent to '+b.dataset.n)};

    /* Feedback module commented out: Recent feedback
    // ---------- Recent feedback ----------
    const stars=n=>'★'.repeat(n)+'<span class="text-slate-300">'+'★'.repeat(5-n)+'</span>';
    $('fbList').innerHTML=feedback.slice(0,4).map(f=>
      `<li class="py-3"><div class="flex items-center justify-between"><p class="text-sm font-medium text-slate-800">${f.customer}</p><span class="text-amber-400 text-sm tracking-wide">${stars(f.rating)}</span></div>
       <p class="text-xs text-slate-500 mt-0.5">${f.service}</p><p class="text-sm text-slate-600 mt-1">${f.comment}</p></li>`).join('');
    */
  })();
  </script>
</body>
</html>
